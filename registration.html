<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registration Form</title>
    <style>
        :root {
            --teal: #0f766e;
            --teal-dark: #115e59;
            --gold: #f5b83d;
            --ink: #1f2d2b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--ink);
            line-height: 1.5;
            text-align: center;
            background: radial-gradient(ellipse at center, #eaf4f1 50%, #b5d1c9 100%);
            background-attachment: fixed;
        }

        /* Navigation bar */
        nav {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        nav a {
            padding: 6px 16px;
            border-radius: 20px;
            color: var(--teal-dark);
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }
        nav a:hover { background: var(--teal); color: white; }
        nav a.active { background: var(--teal); color: white; }

        a:focus-visible,
        button:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px;
        }

        h1 {
            color: var(--teal-dark);
            margin: 32px 0 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        h1::after {
            content: "";
            display: block;
            width: 80px;
            height: 4px;
            margin: 10px auto 0;
            background: var(--gold);
            border-radius: 2px;
        }

        /* The form is the card */
        form {
            max-width: 640px;
            margin: 0 auto 40px;
            padding: 24px 28px;
            text-align: left;
            background: white;
            border-top: 5px solid var(--teal);
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
        }

        /* Each group of fields */
        fieldset {
            margin: 0 0 20px;
            padding: 16px 18px;
            border: 1px solid #cfe3de;
            border-radius: 10px;
        }
        legend {
            padding: 0 8px;
            font-weight: 700;
            color: var(--teal-dark);
        }

        fieldset.fields label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        fieldset.fields input,
        fieldset.fields textarea {
            margin-bottom: 14px;
        }

        /* Radio buttons and checkboxes sit in a row */
        fieldset.choices {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 20px;
        }
        fieldset.choices legend { margin-bottom: 4px; }

        input[type="radio"],
        input[type="checkbox"] {
            accent-color: var(--teal);
            margin-right: 4px;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 8px 10px;
            font: inherit;
            border: 1px solid #9bbdb5;
            border-radius: 6px;
            transition: 0.3s;
        }
        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(15,118,110,0.2);
        }
        textarea { resize: vertical; }

        /* Buttons */
        fieldset.actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 0;
            padding: 0;
            border: none;
        }
        button {
            padding: 10px 28px;
            font: inherit;
            font-weight: 600;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        button[type="submit"] { background: var(--teal); color: white; }
        button[type="submit"]:hover { background: var(--gold); color: black; }
        button[type="reset"] { background: #e3ece9; color: var(--ink); }
        button[type="reset"]:hover { background: #cbd9d5; }

        @media (max-width: 560px) {
            nav {
                padding: 10px;
            }

            nav a {
                width: 100%;
                text-align: center;
            }

            form {
                margin: 0 12px 40px;
                padding: 16px;
            }

            h1 {
                font-size: 1.8rem;
                margin-top: 20px;
            }

            fieldset.choices {
                display: block;
            }

            fieldset.choices label {
                display: block;
                margin: 8px 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="studentregistration.html">Student Registration Table</a>
        <a class="active" href="registration.html">Registration</a>
    </nav>

    <h1>Student Registration Form</h1>

    <form action="">
        <fieldset class="fields">
            <legend>Personal Information</legend>

            <label for="name">Full Name</label>
            <input type="text" name="name" id="name" placeholder="Enter your full name" required>

            <label for="email">Email</label>
            <input type="text" name="email" id="email" placeholder="Enter your Email" required>

            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Enter your password" required>

            <label for="age">Age</label>
            <input type="number" name="age" id="age" placeholder="Enter your Age" required>

            <label for="birthdate">Birth Date</label>
            <input type="date" name="birthdate" id="birthdate" required>

            <label for="mobile">Mobile Number</label>
            <input type="tel" name="mobile" id="mobile" placeholder="Enter your Mobile Phone" required>
        </fieldset>

        <fieldset class="choices">
            <legend>Program</legend>
            <label for="bsit"><input type="radio" name="program" id="bsit" value="1" required>BSIT</label>
            <label for="bsie"><input type="radio" name="program" id="bsie" value="2" required>BSIE</label>
            <label for="bit"><input type="radio" name="program" id="bit" value="3" required>BIT</label>
        </fieldset>

        <fieldset class="choices">
            <legend>Year Level</legend>
            <label for="first"><input type="radio" name="year" id="first" value="1" required>1st Year</label>
            <label for="second"><input type="radio" name="year" id="second" value="2" required>2nd Year</label>
            <label for="third"><input type="radio" name="year" id="third" value="3" required>3rd Year</label>
            <label for="fourth"><input type="radio" name="year" id="fourth" value="4" required>4th Year</label>
        </fieldset>

        <fieldset class="choices">
            <legend>Programming Skills</legend>
            <label for="c"><input type="checkbox" name="skill" id="c" value="C">C</label>
            <label for="java"><input type="checkbox" name="skill" id="java" value="Java">Java</label>
            <label for="python"><input type="checkbox" name="skill" id="python" value="Python">Python</label>
        </fieldset>

        <fieldset>
            <legend>Address</legend>
            <textarea name="address" id="address" rows="3" placeholder="Enter your complete address"></textarea>
        </fieldset>

        <fieldset class="actions">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </fieldset>
    </form>
</body>
</html>
